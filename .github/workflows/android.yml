name: Android APK (Debug)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHON_VERSION: "3.11"
      JAVA_VERSION: "17"
      BUILDOZER_VERSION: "1.5.0"
      CYTHON_VERSION: "0.29.36"
      SETUPTOOLS_VERSION: "80.10.2"
      WHEEL_VERSION: "0.46.3"
      ANDROID_API: "34"
      ANDROID_BUILD_TOOLS: "34.0.0"
      ANDROID_NDK: "25b"
      ANDROID_NDK_PACKAGE: "25.2.9519653"
      P4A_REPO: "https://github.com/kivy/python-for-android.git"
      DEFAULT_P4A_COMMIT: "957a3e5f8c270f7aa648ba185e5a68c1077a798d"
      CACHE_EPOCH: ${{ vars.CACHE_EPOCH || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve build mode
        id: resolve_build_mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "builds/android/tools/build_android.sh" ]; then
            echo "build_mode=fallback_script" >> "$GITHUB_OUTPUT"
            echo "spec_path=" >> "$GITHUB_OUTPUT"
            echo "BUILD_MODE=fallback_script" >> "$GITHUB_ENV"
            echo "Resolved build mode: fallback_script"
            exit 0
          fi
          if [ -f "buildozer.spec" ]; then
            echo "build_mode=buildozer" >> "$GITHUB_OUTPUT"
            echo "spec_path=buildozer.spec" >> "$GITHUB_OUTPUT"
            echo "BUILD_MODE=buildozer" >> "$GITHUB_ENV"
            echo "BUILDOZER_SPEC_PATH=buildozer.spec" >> "$GITHUB_ENV"
            echo "Resolved build mode: buildozer (buildozer.spec)"
            exit 0
          fi
          if [ -f "_buildozer_cfg/buildozer.spec" ] && [ -f "scripts/run_buildozer_with_spec.py" ]; then
            echo "build_mode=buildozer_explicit_spec" >> "$GITHUB_OUTPUT"
            echo "spec_path=_buildozer_cfg/buildozer.spec" >> "$GITHUB_OUTPUT"
            echo "BUILD_MODE=buildozer_explicit_spec" >> "$GITHUB_ENV"
            echo "BUILDOZER_SPEC_PATH=_buildozer_cfg/buildozer.spec" >> "$GITHUB_ENV"
            echo "Resolved build mode: buildozer_explicit_spec (_buildozer_cfg/buildozer.spec)"
            exit 0
          fi
          echo "ERROR: No build configuration found. Expected either builds/android/tools/build_android.sh or buildozer spec file." >&2
          exit 1

      - name: Resolve P4A_COMMIT (fork-safe)
        if: steps.resolve_build_mode.outputs.build_mode != 'fallback_script'
        shell: bash
        env:
          P4A_COMMIT_VAR: ${{ vars.P4A_COMMIT }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          is_fork_pr="false"
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_HEAD_REPO" && "$PR_HEAD_REPO" != "$BASE_REPO" ]]; then
            is_fork_pr="true"
          fi
          echo "IS_FORK_PR=$is_fork_pr" >> "$GITHUB_ENV"

          if [[ -n "${P4A_COMMIT_VAR:-}" ]]; then
            echo "P4A_COMMIT=$P4A_COMMIT_VAR" >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ "$is_fork_pr" == "true" ]]; then
            if [[ -z "${DEFAULT_P4A_COMMIT:-}" || "$DEFAULT_P4A_COMMIT" == "PUT_YOUR_KNOWN_GOOD_P4A_COMMIT_HERE" ]]; then
              echo "::error::Fork PR: vars.P4A_COMMIT недоступен и DEFAULT_P4A_COMMIT не задан."
              exit 1
            fi
            echo "P4A_COMMIT=$DEFAULT_P4A_COMMIT" >> "$GITHUB_ENV"
            echo "::notice::Fork PR detected; using DEFAULT_P4A_COMMIT=$DEFAULT_P4A_COMMIT"
          else
            echo "::error::Missing vars.P4A_COMMIT (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - name: Cache Buildozer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-epoch${{ env.CACHE_EPOCH }}-buildozer-py${{ env.PYTHON_VERSION }}-bz${{ env.BUILDOZER_VERSION }}-${{ hashFiles('buildozer.spec', '_buildozer_cfg/buildozer.spec', '.github/workflows/android.yml') }}
          restore-keys: |
            ${{ runner.os }}-epoch${{ env.CACHE_EPOCH }}-buildozer-py${{ env.PYTHON_VERSION }}-

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-epoch${{ env.CACHE_EPOCH }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'buildozer.spec', '_buildozer_cfg/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-epoch${{ env.CACHE_EPOCH }}-gradle-

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-epoch${{ env.CACHE_EPOCH }}-pip-${{ hashFiles('**/requirements*.txt', '**/*lock*', 'buildozer.spec', '_buildozer_cfg/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-epoch${{ env.CACHE_EPOCH }}-pip-

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            ccache \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            liblzma-dev \
            libncurses5 \
            libncurses5-dev \
            libtinfo6 \
            cmake \
            ninja-build \
            python3-dev \
            openjdk-17-jdk

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install pinned Android SDK/NDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_PACKAGE}"

      - name: Install Python build tooling
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer==${BUILDOZER_VERSION} \
            Cython==${CYTHON_VERSION} \
            wheel==${WHEEL_VERSION} \
            setuptools==${SETUPTOOLS_VERSION}

      - name: Checkout pinned python-for-android
        if: steps.resolve_build_mode.outputs.build_mode != 'fallback_script'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${P4A_COMMIT:-}" ]; then
            echo "ERROR: P4A_COMMIT was not resolved." >&2
            exit 1
          fi
          if [ "$(printf '%s' "$P4A_COMMIT" | tr '[:upper:]' '[:lower:]')" = "head" ]; then
            echo "ERROR: P4A_COMMIT=HEAD is not allowed." >&2
            exit 1
          fi
          rm -rf .p4a-src
          git clone --filter=blob:none "$P4A_REPO" .p4a-src
          git -C .p4a-src checkout "$P4A_COMMIT"
          git -C .p4a-src rev-parse HEAD
          echo "APP_P4A_SOURCE_DIR=${GITHUB_WORKSPACE}/.p4a-src" >> "$GITHUB_ENV"

      - name: Validate buildozer.spec (p4a.commit)
        if: steps.resolve_build_mode.outputs.spec_path != ''
        shell: bash
        run: |
          set -euo pipefail
          spec="${{ steps.resolve_build_mode.outputs.spec_path }}"
          [[ -f "$spec" ]] || { echo "::error::Spec not found at $spec"; exit 1; }

          p4a_commit="$(grep -E '^\s*p4a\.commit\s*=' "$spec" | tail -n1 | sed -E 's/^\s*p4a\.commit\s*=\s*//')"
          if [[ -z "${p4a_commit:-}" || "${p4a_commit}" == "HEAD" ]]; then
            if [[ -n "${APP_P4A_SOURCE_DIR:-}" ]]; then
              echo "::warning::Spec has no pinned p4a.commit (or HEAD), but APP_P4A_SOURCE_DIR is set; CI remains deterministic."
            else
              echo "::error::Spec must pin p4a.commit (not empty, not HEAD)."
              exit 1
            fi
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${BUILD_MODE}" = "fallback_script" ]; then
            chmod +x builds/android/tools/build_android.sh
            bash builds/android/tools/build_android.sh android debug
            exit 0
          fi

          export APP_ANDROID_API="${ANDROID_API}"
          export APP_ANDROID_NDK="${ANDROID_NDK}"
          export APP_ANDROID_BUILD_TOOLS_VERSION="${ANDROID_BUILD_TOOLS}"

          if [ "${BUILD_MODE}" = "buildozer_explicit_spec" ]; then
            python scripts/run_buildozer_with_spec.py -v android debug
          else
            buildozer -v android debug
          fi

      - name: Locate APK
        id: locate_apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find . -type f \( -name '*debug*.apk' -o -name '*.apk' \) \
            | grep -E '/(bin|outputs/apk)/' \
            | head -n 1 || true)"
          if [ -z "${APK_PATH}" ]; then
            echo "No APK found after build." >&2
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" | tee -a "$GITHUB_ENV"
          echo "APK found at: $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
