# EN: Dedicated nginx virtual host for the Telegram Mini App subdomain.
# RU: Отдельный nginx vhost для поддомена Telegram Mini App.
server {
    listen 80;
    listen [::]:80;
    server_name tg.escape2mars.space;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# EN: Enable this HTTPS vhost only after DNS for tg.escape2mars.space points to the VPS
# and port 443 is free for nginx. TLS cert paths below match a standard certbot layout.
# RU: Включать этот HTTPS vhost только после того, как DNS для tg.escape2mars.space
# укажет на VPS и порт 443 будет освобождён под nginx. Пути сертификатов ниже
# соответствуют стандартной раскладке certbot.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tg.escape2mars.space;

    ssl_certificate /etc/letsencrypt/live/tg.escape2mars.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg.escape2mars.space/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:tg_escape2mars_space:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
